[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drivable-area-estimation"
version = "0.2.0"
description = "Road/lane center estimation, temporal direction tracking, and compact arrow overlays"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24,<2", "opencv-python>=4.7,<5", "scipy>=1.10,<2",
  "scikit-image>=0.24,<0.25", "Pillow>=9.5,<12",
]

[project.optional-dependencies]
inference = ["torch>=2.2,<3", "transformers==4.57.6"]
dev = ["ruff>=0.8"]

[project.scripts]
road-area = "drivable_area.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"drivable_area._vendor.twinlitenet" = ["LICENSE"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/drivable_area/_vendor/twinlitenet/model.py" = ["F841"]
